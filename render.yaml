# Render Blueprint. New > Blueprint > this repo; then set QLOO_API_KEY in the dashboard.
services:
  - type: web
    name: hostwise
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_DAILY_CALL_CAP
        value: "1500"
