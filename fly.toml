# Fly.io config. Deploy with: fly launch --copy-config --no-deploy && fly secrets set QLOO_API_KEY=... && fly deploy
app = "hostwise-ruicodex"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  QLOO_BASE_URL = "https://hackathon.api.qloo.com"
  QLOO_DAILY_CALL_CAP = "1500"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
